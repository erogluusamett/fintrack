spring:
  application:
    name: fintrack

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USERNAME:fintrack}
    password: ${DB_PASSWORD:fintrack}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@fintrack.dev}

fintrack:
  scheduler:
    # Her gün 01:00'de tekrarlayan işlemleri gerçek transaction'a çevirir.
    recurring-transaction-cron: ${RECURRING_TX_CRON:0 0 1 * * *}
    # Her gün 08:00'de yaklaşan abonelik yenilemelerini kontrol eder.
    subscription-reminder-cron: ${SUBSCRIPTION_REMINDER_CRON:0 0 8 * * *}
    subscription-reminder-window-days: ${SUBSCRIPTION_REMINDER_WINDOW_DAYS:3}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-this-is-not-for-production-use-32bytes+}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fintrack: DEBUG
