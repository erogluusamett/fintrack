services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
    ports:
      # Bu makinede zaten 5432'de yerel bir PostgreSQL 15 servisi çalıştığı için
      # container'ı 5433'e map ediyoruz. docker-compose ile çalıştırırken
      # DB_URL=jdbc:postgresql://localhost:5433/fintrack kullan.
      - "5433:5432"
    volumes:
      - fintrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fintrack-postgres-data:
