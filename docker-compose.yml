services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
    ports:
      # Bu makinede zaten 5432'de yerel bir PostgreSQL 15 servisi çalıştığı için
      # container'ı 5433'e map ediyoruz. docker-compose ile çalıştırırken
      # DB_URL=jdbc:postgresql://localhost:5433/fintrack kullan.
      - "5433:5432"
    volumes:
      - fintrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-app
    # Container'lar aynı compose ağında birbirine servis adıyla ulaşır —
    # burada postgres/redis'in HOST'a map edilmiş portları değil (5433/6379),
    # container içindeki gerçek portları (5432/6379) kullanılıyor.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fintrack
      DB_USERNAME: fintrack
      DB_PASSWORD: fintrack
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-secret-must-be-at-least-32-bytes-long}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  fintrack-postgres-data:
