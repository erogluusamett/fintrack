name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests compile

      # Testcontainers gerçek bir PostgreSQL container'ı başlatıp Flyway
      # migration'larına karşı çalıştırır — GitHub-hosted ubuntu runner'da
      # Docker daemon zaten hazır geldiği için ek bir kurulum gerekmez.
      - name: Run tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Package
        run: mvn -B -DskipTests package

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fintrack:${{ github.sha }}
